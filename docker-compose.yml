services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL:-postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable}"
      - "up"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4327:4317" # OTLP gRPC — agent telemetry + server self-observability
      - "4328:4318" # OTLP HTTP
      - "13143:13133" # health_check extension — no shell/wget in this image, so no docker-level healthcheck; verify via GET here

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8020:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8020}
    ports:
      - "3003:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
