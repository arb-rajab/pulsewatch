services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL:-postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable}"
      - "up"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4327:4317" # OTLP gRPC — agent telemetry + server self-observability
      - "4328:4318" # OTLP HTTP
      - "13143:13133" # health_check extension — no shell/wget in this image, so no docker-level healthcheck; verify via GET here

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # ADR-0004: worker-pool size, tick interval, and hard-shutdown deadline
      # are process-startup configuration, not hardcoded constants. Values
      # below match the ADR's own reasoned defaults.
      SCHEDULER_WORKER_POOL_SIZE: ${SCHEDULER_WORKER_POOL_SIZE:-20}
      SCHEDULER_TICK_INTERVAL: ${SCHEDULER_TICK_INTERVAL:-1s}
      SCHEDULER_LEASE_SAFETY_MARGIN: ${SCHEDULER_LEASE_SAFETY_MARGIN:-5s}
      SCHEDULER_HARD_SHUTDOWN_DEADLINE: ${SCHEDULER_HARD_SHUTDOWN_DEADLINE:-30s}
      # FR-023: AES-256 key (base64, 32 decoded bytes) used to decrypt
      # alert_channels.destination_encrypted for dispatch. Empty by default —
      # no channel-registration API exists yet to create a row this would
      # ever need to decrypt (12-session-handoff.md); the scheduler degrades
      # gracefully (logs a warning, skips dispatch) rather than failing to
      # start when it's unset.
      ALERT_CHANNEL_ENCRYPTION_KEY: ${ALERT_CHANNEL_ENCRYPTION_KEY:-}
      # Session 8: real operator-session auth. Stateless HMAC signing key for
      # the pulsewatch_session cookie (05-api-contracts.md) — base64,
      # decoding to at least 32 bytes. Required, no default: unlike
      # ALERT_CHANNEL_ENCRYPTION_KEY above, there is no graceful-degradation
      # path for auth, so an unset/too-short value fails compose up loudly
      # here rather than the backend silently starting with a weak or
      # missing secret (main.go: operatorauth.SigningSecretFromEnv).
      # Generate a real one with: openssl rand -base64 32
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?SESSION_SIGNING_SECRET is required — generate one with: openssl rand -base64 32}
    ports:
      - "8020:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8020}
    ports:
      - "3003:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
