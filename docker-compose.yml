services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL:-postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable}"
      - "up"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4327:4317" # OTLP gRPC — agent telemetry + server self-observability
      - "4328:4318" # OTLP HTTP
      - "13143:13133" # health_check extension — no shell/wget in this image, so no docker-level healthcheck; verify via GET here

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # ADR-0004: worker-pool size, tick interval, and hard-shutdown deadline
      # are process-startup configuration, not hardcoded constants. Values
      # below match the ADR's own reasoned defaults.
      SCHEDULER_WORKER_POOL_SIZE: ${SCHEDULER_WORKER_POOL_SIZE:-20}
      SCHEDULER_TICK_INTERVAL: ${SCHEDULER_TICK_INTERVAL:-1s}
      SCHEDULER_LEASE_SAFETY_MARGIN: ${SCHEDULER_LEASE_SAFETY_MARGIN:-5s}
      SCHEDULER_HARD_SHUTDOWN_DEADLINE: ${SCHEDULER_HARD_SHUTDOWN_DEADLINE:-30s}
      # FR-023: AES-256 key (base64, 32 decoded bytes) used to decrypt
      # alert_channels.destination_encrypted for dispatch. Empty by default —
      # no channel-registration API exists yet to create a row this would
      # ever need to decrypt (12-session-handoff.md); the scheduler degrades
      # gracefully (logs a warning, skips dispatch) rather than failing to
      # start when it's unset.
      ALERT_CHANNEL_ENCRYPTION_KEY: ${ALERT_CHANNEL_ENCRYPTION_KEY:-}
      # Session 8: real operator-session auth. Stateless HMAC signing key for
      # the pulsewatch_session cookie (05-api-contracts.md) — base64,
      # decoding to at least 32 bytes. Required, no default: unlike
      # ALERT_CHANNEL_ENCRYPTION_KEY above, there is no graceful-degradation
      # path for auth, so an unset/too-short value fails compose up loudly
      # here rather than the backend silently starting with a weak or
      # missing secret (main.go: operatorauth.SigningSecretFromEnv).
      # Generate a real one with: openssl rand -base64 32
      SESSION_SIGNING_SECRET: "${SESSION_SIGNING_SECRET:?SESSION_SIGNING_SECRET is required — generate one with: openssl rand -base64 32}"
    # Session 11 (closing the cross-port session-cookie leak found at
    # Session 10's closeout): `backend` now runs two separate HTTP listeners
    # (backend/main.go: operatorSrv on :8080, agentSrv on :8081), not one
    # shared engine. Only the agent-facing listener (:8081, agent-only
    # routes per ADR-0003 — no operatorapi route is ever mounted on it) is
    # published as a host port; :8080 (every operatorapi route, gated by
    # RequireOperator's session cookie) is reachable only over the internal
    # Docker network, by `proxy`/Caddy (R-001) or another container — never
    # directly from the host in plain HTTP. See R-003/R-001 in
    # 10-risk-register.md and 08-deployment-and-operations.md.
    ports:
      - "8020:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Checks both listeners — this container is only "healthy" if the
      # operator-facing (:8080) and agent-facing (:8081) servers are both
      # actually serving, not just whichever one happens to be published.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health && wget -qO- http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://backend:8080}
    # No host port published: the browser reaches this only through the
    # `proxy` service's real HTTPS termination below (R-001,
    # 08-deployment-and-operations.md) — a plain-HTTP path to the same
    # login/dashboard flow would defeat the whole point of adding it.
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real, persistent TLS termination for the operator-facing dashboard/login
  # flow (R-001, 08-deployment-and-operations.md) — replaces Session 9's
  # temporary, torn-down self-signed harness. See ./Caddyfile for the
  # routing/cert details and 08-deployment-and-operations.md for the full
  # cert-choice writeup (self-signed by default; real-domain instructions
  # included).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
