name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, vet, tests, vuln scan, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: pulsewatch
          POSTGRES_DB: pulsewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsewatch -d pulsewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      # Session 5's scheduler tests run against a real Postgres (the
      # concurrency/restart-recovery/shutdown proofs this session requires
      # need the actual schema, not a mock) — migrations must apply before
      # `go test`, not only in the later up/down/up reversibility check
      # below.
      - name: Apply migrations before tests
        env:
          DATABASE_URL: postgres://pulsewatch:pulsewatch@localhost:5432/pulsewatch?sslmode=disable
        run: migrate -path=./migrations -database="$DATABASE_URL" up

      - name: go test
        env:
          DATABASE_URL: postgres://pulsewatch:pulsewatch@localhost:5432/pulsewatch?sslmode=disable
        run: go test ./... -race -v

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run migrations against a fresh Postgres, verify down reverses cleanly, re-apply up
        env:
          DATABASE_URL: postgres://pulsewatch:pulsewatch@localhost:5432/pulsewatch?sslmode=disable
        run: |
          migrate -path=./migrations -database="$DATABASE_URL" up
          migrate -path=./migrations -database="$DATABASE_URL" down -all
          migrate -path=./migrations -database="$DATABASE_URL" up

  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: npm audit
        run: npm audit --omit=dev

  otel-collector-config:
    name: OTel Collector config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate otel-collector-config.yaml
        run: >-
          docker run --rm
          -v ${{ github.workspace }}/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
          otel/opentelemetry-collector-contrib:0.159.0
          validate --config=/etc/otelcol-contrib/config.yaml

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["go", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ADR-0005 (Session 14): offline validation of the two new deployment-
  # layer additions. Neither step needs a live cluster or cloud
  # credentials — `terraform fmt` is pure HCL syntax/formatting, and
  # `kubectl kustomize` performs a real base+overlay build (image
  # substitution, patches, ConfigMap generation) without contacting an
  # API server. Real `terraform apply`/`kubectl apply` against a live
  # cluster remain out of CI's reach (R-008, 10-risk-register.md; B-009,
  # 11-backlog.md) — this job catches syntax/structural regressions only.
  iac-and-k8s-manifests-validate:
    name: Terraform fmt + Kubernetes manifest build (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -diff -recursive

      - name: kubectl kustomize build (production overlay)
        run: >-
          kubectl kustomize --load-restrictor LoadRestrictionsNone
          deploy/k8s/overlays/production
          > /dev/null

  # Builds and pushes real, pullable images for deploy/k8s/rollout.sh to
  # deploy — 08-deployment-and-operations.md's own Compose section already
  # names "no CD pipeline publishes images anywhere yet" as a real, named
  # gap; this closes it for the Kubernetes target specifically. Gated on
  # both application CI jobs and on push to main only — a PR branch's
  # untested image is never published.
  publish-images:
    name: Publish backend/frontend images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pulsewatch-backend:latest
            ghcr.io/${{ github.repository_owner }}/pulsewatch-backend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pulsewatch-frontend:latest
            ghcr.io/${{ github.repository_owner }}/pulsewatch-frontend:${{ github.sha }}
