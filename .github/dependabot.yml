version: 2
updates:
  # Backend Go module (backend/go.mod)
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # OTLP normalizer Go module
  - package-ecosystem: gomod
    directory: "/serverless/otlp-normalizer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Frontend dependencies (frontend/package.json)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # SvelteKit 3 is a migration, not a bump: svelte.config.js and the $lib
      # alias are gone, tsconfig must extend $app/tsconfig, and it peers
      # typescript ^6 (so TypeScript 7 cannot be installed either). adapter-node 6
      # peers kit 3, so the two move together. Do this as a deliberate PR.
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # Backend Dockerfile base image
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Frontend Dockerfile base image
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Terraform providers/modules (infra/terraform)
  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Provider majors (kubernetes 3.x, helm 3.x) change resource schemas; CI only
      # runs `terraform fmt` and an offline kustomize build, so it cannot show they
      # are safe. Upgrade deliberately with a real `terraform plan`.
      - dependency-name: "hashicorp/kubernetes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/helm"
        update-types: ["version-update:semver-major"]
  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Service images pinned in docker-compose*.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps of stateful services (databases, brokers, search) need a
      # deliberate data-migration plan, not a drive-by version bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
